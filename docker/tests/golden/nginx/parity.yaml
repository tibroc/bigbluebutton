allowed:
  # nginx.conf (Ubuntu's file with bbb-config's edits)
  - file: etc/nginx/nginx.conf
    line: '^user www-data;$'
    reason: "docker/README.md 'Running under an arbitrary UID/GID': the master runs as the container's non-root UID; the user switch needs root (and Alpine has no www-data)"
  - file: etc/nginx/nginx.conf
    line: '^pid /(run|tmp)/nginx\.pid;$'
    reason: "images.md Runtime ('Writable paths only: declared volumes and /tmp')"
  - file: etc/nginx/nginx.conf
    line: '^[[:space:]]*server_names_hash_bucket_size 128;$'
    reason: "RB-01 deviation: added by hand for the long VM hostname, not upstream (parity/README.md 'Known deviations')"
  - file: etc/nginx/nginx.conf
    line: '^([[:space:]]*##|[[:space:]]*# Temporary files below /tmp: the only writable path for an arbitrary UID|[[:space:]]*(client_body|proxy|fastcgi|uwsgi|scgi)_temp_path /tmp/nginx-[a-z]+_temp;|)$'
    reason: "images.md Runtime ('Writable paths only: declared volumes and /tmp'): the base image's compiled-in temp paths are below /var/cache/nginx"
  # site file (bbb-install.sh, haproxy variant)
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^[[:space:]]*listen (80|\[::\]:80);$|^[[:space:]]*listen 80 default_server;$'
    reason: "images.md nginx row (server_name _ / default_server behind haproxy). The [::] listener is dropped: compose.md Networks (the bbb network is IPv4, BBB_NETWORK_SUBNET), and a [::] bind fails where the container has no IPv6 (the base image only adds one if /proc/net/if_inet6 exists, /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh:16)"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^[[:space:]]*server_name (bbb\.example\.com|_);$'
    reason: "images.md nginx row: server_name _, nginx does not consume BBB_DOMAIN"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^[[:space:]]*return 301 https://\$(server_name|host)\$request_uri; #redirect HTTP to HTTPS$'
    reason: "images.md nginx row: with server_name _ the bare-metal $server_name redirect would go to https://_; $host is the requested name"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^set_real_ip_from (127\.0\.0\.1|172\.30\.82\.0/24);$'
    reason: "config-contract.yaml BBB_NETWORK_SUBNET: haproxy is another container on the bbb network, so PROXY-protocol addresses are trusted from that subnet instead of 127.0.0.1"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^[[:space:]]*# (this double listening is intended|binary protocol\. haproxy has to decide|negotiated by ALPN|Depending on the ALPN value|ALPN value h2\) or 81|Http2 is disabled|listen 127\.0\.0\.1:82 http2|listen \[::1\]:82 http2|We terminate SSL on haproxy, which sends HTTP/1\.x|protocol\. HTTP/2 is not offered)|^[[:space:]]*#$'
    reason: "comments only: rewritten without the HTTP/2 port 82 that the container setup does not have (ADR-07; haproxy golden has no nginx-http2 backend)"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^[[:space:]]*listen (127\.0\.0\.1:82 proxy_protocol|\[::1\]:82);$'
    reason: "ADR-07 / compose.md 'Routing on 443': haproxy sends HTTP/1.1 only; no HTTP/2 port"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^[[:space:]]*listen (127\.0\.0\.1:81 proxy_protocol|\[::1\]:81|81 proxy_protocol default_server);$'
    reason: "compose.md 'Routing on 443': haproxy is another container (server nginx nginx:81 send-proxy), so :81 is not bound to loopback; default_server and no [::] as for :80 (images.md nginx row, compose.md Networks)"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^[[:space:]]*(# Location fragments of the image\. On bare metal, /etc/bigbluebutton/nginx/ holds a symlink|# to this file; an include_default\.nginx placed there replaces this line\.|include /usr/share/bigbluebutton/include_default\.nginx;)$'
    reason: "config-contract.yaml overrides (nginx, /etc/bigbluebutton/nginx/): the admin directory stays empty in the image, so the fragments are included here instead of through bbb-config's symlink there (after-install.sh:128-133); an admin include_default.nginx there replaces this line"
  - file: etc/nginx/sites-available/bigbluebutton
    line: '^$'
    reason: "blank lines around the removed port 82 listeners and the added include"
  # learning dashboard: the app is shipped in the image, only the per-meeting JSON comes from
  # the bbb-data volume. The upstream file has CRLF line endings, hence [[:space:]]*$.
  - file: usr/share/bigbluebutton/nginx/learning-dashboard.nginx
    line: '^[[:space:]]*alias /(var|usr/share)/bigbluebutton/learning-dashboard/;[[:space:]]*$'
    reason: "ADR-09 / compose.md Volumes ('Image-shipped content (... dashboard static files ...) is served by nginx from its image'): /var/bigbluebutton is the bbb-data volume, which holds only the JSON files bbb-web writes, so the prefix serves the app from /usr/share/bigbluebutton/learning-dashboard"
  - file: usr/share/bigbluebutton/nginx/learning-dashboard.nginx
    line: '^([[:space:]]*location ~ "[^"]*/learning_dashboard_data[^"]*" \{|[[:space:]]*alias /var/bigbluebutton/learning-dashboard/\$1;|[[:space:]]*\}|)[[:space:]]*$'
    reason: "ADR-09 / compose.md Volumes ('nginx has separate locations for it and for volume content'): a regex location nested in the prefix serves only <meetingId>/<token>/learning_dashboard_data.json from bbb-data, where bbb-web writes it (LearningDashboardService.java:34,40,96 @ 35cad46a9f)"
  # fragments: services are other containers (compose.md 'Service names')
  - file: usr/share/bigbluebutton/nginx/bbb-shared-notes-server.nginx
    line: '^[[:space:]]*proxy_pass http://(localhost|shared-notes):8787/(collaboration|api/|sample);$'
    reason: "compose.md 'Service names': shared-notes is its own container (port 8787, bbb-shared-notes-server/config/default.yml:3)"
  - file: usr/share/bigbluebutton/nginx/bbb-shared-notes-server.nginx
    line: '^[[:space:]]*proxy_pass[[:space:]]+http://(127\.0\.0\.1|bbb-web):8090/bigbluebutton/connection/checkGraphqlAuthorization;$'
    reason: "compose.md 'Service names': bbb-web is its own container"
  - file: usr/share/bigbluebutton/nginx/graphql.nginx
    line: '^[[:space:]]*proxy_pass[[:space:]]+http://(127\.0\.0\.1|graphql-middleware):8378; #Graphql Middleware$'
    reason: "compose.md 'Service names': graphql-middleware is its own container"
  - file: usr/share/bigbluebutton/nginx/graphql.nginx
    line: '^[[:space:]]*proxy_pass http://(127\.0\.0\.1:8185|graphql-server:8085); #Hasura$'
    reason: "adr-templating.md row 29: Hasura REST goes to graphql-server:8085 directly; no local load balancer (hasura-loadbalancer.conf), replicas sit behind one service name"
  - file: usr/share/bigbluebutton/nginx/livekit.nginx
    line: '^[[:space:]]*proxy_pass http://(127\.0\.0\.1|livekit):7880/;$'
    reason: "ADR-06 / compose.md 'Routing on 443': location /livekit/ to livekit:7880 (OQ-05)"
  - file: usr/share/bigbluebutton/nginx/web
    line: '^[[:space:]]*proxy_pass[[:space:]]+http://(127\.0\.0\.1|bbb-web):8090(\$uri\$is_args\$args)?;$'
    reason: "compose.md 'Service names': bbb-web is its own container (port 8090, bbb-web.env:3)"
  - file: usr/share/bigbluebutton/nginx/webrtc-sfu.nginx
    line: '^[[:space:]]*proxy_pass http://(127\.0\.0\.1|bbb-webrtc-sfu):3008;$'
    reason: "compose.md 'Service names': bbb-webrtc-sfu is its own container (client port 3008, contract internal CLIENT_HOST)"
