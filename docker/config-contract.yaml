  # Later phase (ADR-15, optional `dialin` profile). Not part of this contract version; kept as
  # a reminder of what the profile will need. No FreeSWITCH variables before that phase.
  #
  # - name: DIALIN_SIP_...           SIP gateway address / trunk settings (FreeSWITCH as gateway)
  #   sources: docs/docs/administration/customize.md:940-1006 @ 35cad46a9f
  # - livekit-sip reuses LIVEKIT_API_KEY / LIVEKIT_API_SECRET and must reject its `devkey`
  #   placeholder (build/packages-template/bbb-livekit/livekit-sip.yaml:3-5 @ 35cad46a9f).
  # - FreeSWITCH ESL password: the upstream default `ClueCon` is a known placeholder.

# --------------------------------------------------------------------------------------------
# derived: computed by the images from the variables above. Never set by the admin.
# --------------------------------------------------------------------------------------------
derived:
  - name: compose_profiles
    formula: '${BBB_FEATURES}'
    inputs: [BBB_FEATURES]
    env: COMPOSE_PROFILES
    env_file: true
    targets: ['compose: COMPOSE_PROFILES (read from .env by the Compose CLI)']
    description: >-
      Compose profiles follow the features. Written into .env as a self-reference; do not
      change it.
    status: pending-g3
    sources:
      - build/packages-template/bigbluebutton/build.sh:16-33 @ 35cad46a9f — default package set (recording in, webhooks out)

  - name: server_url
    formula: 'https://${BBB_DOMAIN}'
    inputs: [BBB_DOMAIN]
    targets:
      - 'bbb-web: bigbluebutton.web.serverURL (static properties file referencing env, LX-1)'
      - 'akka-apps: services.bbbWebAPI = server_url + /bigbluebutton/api'
    description: >-
      Public base URL. Upstream defaults many bbb-web URLs to it (client, GraphQL, presentation
      base, CORS origin).
    status: draft
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:398,407,411,414,520,550 @ 35cad46a9f
      - akka-bbb-apps/src/universal/conf/application.conf:69 @ 35cad46a9f
