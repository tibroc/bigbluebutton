# BigBlueButton container stack: configuration contract.
#
# Status: DRAFT, to be approved at gate G3. This file is the public configuration API of the
# container images: every environment variable an admin may set is declared here. Generated
# from it (docker/contract/generate.sh): .env.sample (Tier 1) and
# docs/docs/administration/docker-configuration.md (all tiers). docker/contract/validate.sh
# checks this file against the schema in docker/contract/README.md; docker/contract/drift-check.sh
# compares it with what the compose file and the image entrypoints use.
#
# Sources cite upstream as `path:line @ sha`. Pins: bigbluebutton 35cad46a9f,
# bbb-webrtc-sfu 88cb1a9a1c, bbb-webhooks 9787aea975, bbb-webrtc-recorder 1ecff54c7c,
# bbb-install 2547823185, livekit-server 8d11efdfcd.

version: 1

meta:
  status: draft
  upstream: 35cad46a9fb13d07df40a044834a32272be38fb8

# --------------------------------------------------------------------------------------------
# variables: what an admin may set. Tier 1 = .env essentials, Tier 2 = optional with defaults.
# --------------------------------------------------------------------------------------------
variables:
  # ------------------------------------------------------------------------------- Tier 1
  - name: BBB_DOMAIN
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?'
    setup: ask
    description: >-
      Public hostname of the server (fully qualified, no scheme, no port). All public URLs, the
      TLS certificate, the TURN realm and the TURN URIs handed to clients are derived from it.
    consumers: [bbb-web, akka-apps, haproxy, coturn, bbb-webrtc-sfu, recording, webhooks, setup, preflight]
    example: bbb.example.com
    status: draft
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:398,407,411,414,520,550 @ 35cad46a9f — serverURL and the URLs defaulting to it
      - akka-bbb-apps/src/universal/conf/application.conf:69 @ 35cad46a9f — services.bbbWebAPI
      - record-and-playback/core/scripts/bigbluebutton.yml:69 @ 35cad46a9f — playback_host
      - build/packages-template/bbb-webhooks/after-install.sh:12,16 @ 35cad46a9f — bbb.serverDomain
      - config/default.example.yml:539-542 @ 88cb1a9a1c — SFU livekit.bbbDomain (env LIVEKIT_BBB_DOMAIN)
      - docs/docs/administration/turn-server.md:184 @ 35cad46a9f — coturn realm
      - bbb-install.sh:1864-1872 @ 2547823185 — TURN URIs use the host name
      - bbb-install.sh:1604-1605 @ 2547823185 — certificate for the host name

  - name: BBB_PUBLIC_IPV4
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
    setup: detect
    description: >-
      Public IPv4 address of the server. Left empty in .env, the setup container detects it and
      writes it. LiveKit announces it as node_ip and coturn as external-ip.
    consumers: [livekit, coturn, setup, preflight]
    example: 203.0.113.10
    status: pending-g2
    notes: >-
      How LiveKit and coturn use it on a bridge network (node_ip candidate rewriting, coturn
      relay address) is decided by spike RB-02 (ADR-06, OQ-12, OQ-14).
    sources:
      - pkg/routing/node.go:51-53 @ 8d11efdfcd — livekit fails without node_ip (ErrIPNotSet)
      - cmd/server/main.go:44-99 @ 8d11efdfcd — livekit env NODE_IP
      - docs/docs/administration/turn-server.md:169-174 @ 35cad46a9f — coturn external-ip
      - bbb-install.sh:869-875 @ 2547823185 — upstream TURN_IP from the host address

  - name: BBB_PUBLIC_IPV6
    tier: 1
    required: false
    secret: false
    default: null
    pattern: '([0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f]{0,4}'
    setup: detect
    description: >-
      Public IPv6 address of the server, optional. Empty means IPv4 only. Used by preflight to
      check the AAAA record.
    consumers: [preflight]
    example: '2001:db8::10'
    status: pending-g2
    notes: >-
      The pattern checks the shape only (hex groups and colons), not full IPv6 syntax. Upstream
      binds haproxy on IPv6 but configures no IPv6 address in LiveKit or coturn; whether
      LiveKit or coturn need it in containers is UNVERIFIED and part of RB-02.
    sources:
      - bbb-install.sh:568-575 @ 2547823185 — bbb-install requires IPv6 support
      - bbb-install.sh:920 @ 2547823185 — haproxy binds :::443

  - name: BBB_SHARED_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      API shared secret (securitySalt). Signs API calls, recording callbacks and webhooks.
      Generated by setup; the known upstream placeholder is rejected.
    consumers: [bbb-web, akka-apps, recording, webhooks]
    example: fixturebbbsharedsecretnotreal0000000000000000000
    status: draft
    notes: >-
      bbb-web cannot take it from env directly: its properties file references it as
      `${BBB_SHARED_SECRET}` (LX-1). Recording reads the properties file itself, so the
      recording image needs the real value in /etc/bigbluebutton/bbb-web.properties.
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:448 @ 35cad46a9f — securitySalt
      - build/packages-template/bbb-web/after-install.sh:26-31 @ 35cad46a9f — upstream generates alphanumerics
      - akka-bbb-apps/src/universal/conf/application.conf:70 @ 35cad46a9f — services.sharedSecret
      - record-and-playback/core/scripts/post_publish/post_publish_recording_ready_callback.rb:72-80 @ 35cad46a9f — recording reads securitySalt from the file
      - config/custom-environment-variables.yml:1-4 @ 9787aea975 — webhooks env SHARED_SECRET

  - name: LIVEKIT_API_KEY
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '[A-Za-z0-9]{8,64}'
    setup: generate
    description: >-
      LiveKit API key (identifier of the key pair). Shared by livekit-server, bbb-webrtc-sfu and
      bbb-webrtc-recorder. Generated by setup; the SFU placeholder LIVEKIT_KEY and livekit-sip's
      devkey are rejected.
    consumers: [livekit, bbb-webrtc-sfu, bbb-webrtc-recorder]
    example: fixturelivekitapikey
    status: draft
    sources:
      - build/packages-template/bbb-livekit/after-install.sh:3-17 @ 35cad46a9f — key pair and webhook.api_key
      - build/packages-template/bbb-webrtc-sfu/after-install.sh:60-71 @ 35cad46a9f — SFU livekit.key
      - build/packages-template/bbb-webrtc-recorder/after-install.sh:15-32 @ 35cad46a9f — BBBRECORDER_LIVEKIT_APIKEY
      - config/default.example.yml:539-542 @ 88cb1a9a1c — SFU placeholder values

  - name: LIVEKIT_API_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      LiveKit API secret belonging to LIVEKIT_API_KEY. At least 32 characters: livekit-server
      only logs an error for shorter secrets, so the entrypoints enforce it.
    consumers: [livekit, bbb-webrtc-sfu, bbb-webrtc-recorder]
    example: fixturelivekitapisecretnotreal000000000000000000
    status: draft
    sources:
      - pkg/config/config.go:778-812 @ 8d11efdfcd — secrets under 32 characters are only logged
      - build/packages-template/bbb-livekit/after-install.sh:3-17 @ 35cad46a9f — generated key pair
      - build/packages-template/bbb-webrtc-recorder/after-install.sh:15-32 @ 35cad46a9f — BBBRECORDER_LIVEKIT_APISECRET

  - name: TURN_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9+/=]{32,}'
    setup: generate
    description: >-
      Shared secret for TURN REST credentials. coturn uses it as static-auth-secret, bbb-web to
      hand time-limited TURN credentials to clients. LiveKit gets no TURN configuration.
    consumers: [coturn, bbb-web]
    example: fixtureturnsecretnotreal000000000000000000000000
    status: draft
    notes: >-
      The pattern admits base64 because bbb-install generates the coturn secret with
      `openssl rand -base64 32`; a secret migrated from bare metal keeps working.
    sources:
      - bigbluebutton-web/grails-app/conf/spring/turn-stun-servers.xml:27-28,43-47 @ 35cad46a9f — TurnServer secret argument
      - docs/docs/administration/turn-server.md:181-184 @ 35cad46a9f — coturn static-auth-secret
      - bbb-install.sh:1908-1923 @ 2547823185 — upstream generates it as base64

  - name: POSTGRES_PASSWORD
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      Password of the PostgreSQL superuser. Used by postgres and by the db-init job that
      (re)creates the BBB databases and roles (ADR-14). Application roles have their own
      passwords (see the Postgres role decision).
    consumers: [postgres, db-init]
    example: fixturepostgrespasswordnotreal000000000000000000
    status: draft
    notes: Bare metal uses peer authentication for the superuser; containers need a password.
    sources:
      - build/packages-template/bbb-graphql-server/after-install.sh:11-14 @ 35cad46a9f — database init as the postgres superuser

  - name: HASURA_ADMIN_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      Hasura admin secret (HASURA_GRAPHQL_ADMIN_SECRET). Only graphql-server and its metadata
      apply step use it.
    consumers: [graphql-server]
    example: fixturehasuraadminsecretnotreal00000000000000000
    status: draft
    sources:
      - build/packages-template/bbb-graphql-server/after-install.sh:44-57 @ 35cad46a9f — generated, written to admin-pass and config.yaml
      - bbb-graphql-server/config.yaml:3 @ 35cad46a9f — admin_secret for the hasura CLI

  - name: ACME_EMAIL
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '[A-Za-z0-9._%+-]+@([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}'
    setup: ask
    description: >-
      Contact e-mail for the Let's Encrypt account of the TLS certificate. Not needed with the
      external-proxy feature.
    consumers: [certificates]
    example: admin@example.com
    status: draft
    notes: >-
      bbb-install refuses the address used in its docs; the certificate service should refuse
      known example addresses too.
    sources:
      - bbb-install.sh:172-177 @ 2547823185 — -e option, docs address refused
      - bbb-install.sh:1604-1605 @ 2547823185 — certbot --email

  - name: BBB_FEATURES
    tier: 1
    required: false
    secret: false
    default: recording
    pattern: '((recording|greenlight|webhooks|monitoring|external-proxy)(,(recording|greenlight|webhooks|monitoring|external-proxy))*)?'
    setup: ask
    description: >-
      Optional features, comma-separated without spaces: recording, greenlight, webhooks,
      monitoring, external-proxy. COMPOSE_PROFILES is derived from it in .env; images read it
      so their configuration matches the running services.
    consumers: [compose, bbb-web, nginx, bbb-webrtc-sfu]
    example: recording
    status: pending-g3
    notes: >-
      Which settings each feature changes is decision features-mapping (OQ-18). Set it only in
      .env: a value exported in the shell can make profiles and image configuration disagree.
    sources:
      - build/packages-template/bigbluebutton/build.sh:16-33 @ 35cad46a9f — recording is part of the default install, webhooks is not
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:319 @ 35cad46a9f — disableRecordingDefault, candidate for the recording flag

  # ------------------------------------------------------------------------------- Tier 2
  - name: BBB_UID
    tier: 2
    required: false
    secret: false
    default: '998'
    pattern: '[1-9][0-9]{0,9}'
    setup: null
    description: >-
      User id of every container that writes the shared data volume (/var/bigbluebutton) and the
      recorder volume. Set it to the bigbluebutton user id of an existing bare-metal tree or NFS
      export to keep its ownership.
    consumers: [bbb-web, export-annotations, recording, bbb-webrtc-recorder, bbb-webrtc-sfu]
    example: '998'
    status: draft
    notes: Bare metal assigns the id per host; 998 is the id of the upstream recorder image.
    sources:
      - build/deb-helper.sh:136-152 @ 35cad46a9f — system user created without a fixed uid
      - Dockerfile:26-37 @ 1ecff54c7c — upstream recorder image user 998

  - name: BBB_GID
    tier: 2
    required: false
    secret: false
    default: '998'
    pattern: '[1-9][0-9]{0,9}'
    setup: null
    description: Group id belonging to BBB_UID.
    consumers: [bbb-web, export-annotations, recording, bbb-webrtc-recorder, bbb-webrtc-sfu]
    example: '998'
    status: draft
    sources:
      - build/deb-helper.sh:136-152 @ 35cad46a9f — system group created without a fixed gid
      - Dockerfile:26-37 @ 1ecff54c7c — upstream recorder image group 998

  - name: BBB_WEB_CONVERSION_URL
    tier: 2
    required: false
    secret: false
    default: null
    pattern: 'https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?'
    setup: null
    description: >-
      URL of the office document conversion service that bbb-web calls (ADR-13). Unset means
      the stack's own conversion service.
    consumers: [bbb-web]
    example: 'http://conversion:8080/convert'
    status: draft
    notes: >-
      The default URL is fixed by the task that builds the conversion service; the example is
      illustrative. bbb-web selects the conversion script with presOfficeConversionExec.
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:44 @ 35cad46a9f — presOfficeConversionExec
      - bbb-libreoffice/assets/convert-remote.sh:30 @ 35cad46a9f — upstream HTTP sample with a hard-coded endpoint

  - name: BBB_WEB_PAGE_TOKEN_SECRET
    tier: 2
    required: false
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: null
    description: >-
      HMAC key for presentation page tokens (pageTokenSecret). Unset means BBB_SHARED_SECRET,
      as upstream.
    consumers: [bbb-web]
    example: null
    status: draft
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:450-452 @ 35cad46a9f — pageTokenSecret defaults to securitySalt
      - bbb-common-web/src/main/scala/org/bigbluebutton/api2/MsgBuilder.scala:105-106 @ 35cad46a9f — token use

  - name: BBB_WEB_MAX_HEAP_SIZE
    tier: 2
    required: false
    secret: false
    default: 384m
    pattern: '[1-9][0-9]*[kKmMgG]'
    setup: null
    description: Java heap size of bbb-web (initial and maximum), JVM size syntax.
    consumers: [bbb-web]
    example: 1g
    status: draft
    sources:
      - build/packages-template/bbb-web/bbb-web.env:4-5 @ 35cad46a9f — INITIAL_HEAP_SIZE / MAX_HEAP_SIZE

  - name: RECORDING_RETENTION_DAYS
    tier: 2
    required: false
    secret: false
    default: '14'
    pattern: '[0-9]{1,5}'
    setup: null
    description: >-
      Recording cleanup after N days; 0 disables it. Upstream semantics: deletes the raw data
      of recordings published more than N days ago, not the published recordings.
    consumers: [recording]
    example: '14'
    status: pending-g3
    notes: Semantics and name are decision recording-retention.
    sources:
      - bigbluebutton-config/cron.daily/bigbluebutton:29,94-123 @ 35cad46a9f — published_days
      - docs/docs/administration/customize.md:64 @ 35cad46a9f — documented setting

  - name: RECORDING_WORKERS
    tier: 2
    required: false
    secret: false
    default: '1'
    pattern: '[1-9][0-9]{0,2}'
    setup: null
    description: Number of parallel recording processing workers (resque COUNT).
    consumers: [recording]
    example: '2'
    status: draft
    sources:
      - record-and-playback/core/systemd/bbb-rap-resque-worker.service:11-12 @ 35cad46a9f — COUNT=1 upstream

  - name: WEBHOOKS_BEARER_AUTH
    tier: 2
    required: false
    secret: false
    default: 'true'
    pattern: 'true|false'
    setup: null
    description: >-
      Webhooks send the shared secret as a Bearer token (true) or as a checksum in the URL
      (false). The entrypoint passes BEARER_AUTH=true or leaves it unset, never "false".
    consumers: [webhooks]
    example: 'false'
    status: draft
    notes: bbb-webhooks treats any non-empty BEARER_AUTH, including "false", as enabled (LX-2).
    sources:
      - config/custom-environment-variables.yml:4 @ 9787aea975 — BEARER_AUTH without __format
      - src/out/webhooks/callback-emitter.js:70-71 @ 9787aea975 — truthiness test
      - build/packages-template/bbb-webhooks/after-install.sh:6-19 @ 35cad46a9f — upstream sets auth2_0 true

  - name: LIVEKIT_RTC_UDP_PORT
    tier: 2
    required: false
    secret: false
    default: '7882'
    pattern: '[1-9][0-9]{0,4}'
    setup: null
    description: >-
      LiveKit WebRTC media port (UDP mux), published 1:1. Upstream uses the range 16384-32768
