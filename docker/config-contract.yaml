# --------------------------------------------------------------------------------------------
# decisions_needed: open questions for G3. Variables they affect carry status pending-g3.
# --------------------------------------------------------------------------------------------
decisions_needed:
  - id: postgres-role-passwords
    question: >-
      The PostgreSQL roles bbb_core, hasura_app, bbb_hasura and blocknote_app use fixed public
      passwords upstream, and the bbb_hasura DSN is a literal in the Hasura metadata. Keep the
      upstream values or generate secrets?
    options:
      - id: a
        text: >-
          Upstream values, no variables. Simplest, parity with bare metal; any container on the
          bbb network that reaches postgres can use the roles.
      - id: b
        text: >-
          One generated Tier 2 secret per role (POSTGRES_BBB_CORE_PASSWORD,
          POSTGRES_HASURA_APP_PASSWORD, POSTGRES_BBB_HASURA_PASSWORD,
          POSTGRES_BLOCKNOTE_PASSWORD). setup generates them, db-init sets them; the graphql
          image rewrites the metadata DSN before metadata apply. Needs four new fixtures.
      - id: c
        text: One generated secret shared by all application roles (one variable, less isolation).
    recommendation: >-
      b. db-init recreates the roles on every version change anyway (ADR-14), so generated
      passwords cost nothing at upgrade time, and admins never see them (Tier 2, generated).
    affects: [POSTGRES_BBB_CORE_PASSWORD, POSTGRES_HASURA_APP_PASSWORD, POSTGRES_BBB_HASURA_PASSWORD, POSTGRES_BLOCKNOTE_PASSWORD]
    related: [G3]

  - id: recording-retention
    question: >-
      Upstream published_days deletes the raw data of recordings published more than N days
      ago; published recordings stay. The contract draft described deleting published
      recordings. Which semantics and name?
    options:
      - id: a
        text: >-
          Upstream semantics, renamed RECORDING_RAW_RETENTION_DAYS (default 14); deleting
          published recordings stays a documented manual recipe, as upstream.
      - id: b
        text: Upstream semantics under the name RECORDING_RETENTION_DAYS.
      - id: c
        text: >-
          Two variables: raw-data retention (upstream) and an opt-in published-recording
          retention (0 = keep forever).
    recommendation: >-
      a. Same behaviour as bare metal, and the name says what is deleted. A published-recording
      retention can be added later without breaking anyone.
    affects: [RECORDING_RETENTION_DAYS]
    related: [G3]

  - id: features-mapping
    question: >-
      Which settings does each BBB_FEATURES entry change, and where do images read the feature
      list from (OQ-18: a shell-exported BBB_FEATURES can disagree with COMPOSE_PROFILES)?
    options:
      - id: a
        text: >-
          Features only switch profiles; images ignore them. bbb-web would still offer
          recording without the recording services.
      - id: b
        text: >-
          Images map features to settings: without recording, bbb-web sets
          disableRecordingDefault=true and nginx drops the playback locations; with it,
          upstream defaults. Images read BBB_FEATURES; docs say to set it only in .env, and
          preflight warns if the shell exports it.
      - id: c
        text: As b, but images read the profile list compose actually used (COMPOSE_PROFILES), pending RB-00.
    recommendation: >-
      b now (simple, testable with render-only), revisit c after RB-00 shows Docker Compose's
      behaviour.
    affects: [BBB_FEATURES]
    related: [OQ-18, G3]

  - id: value-patterns
    question: >-
      Each variable has a value pattern (OQ-23). Adopt the patterns, and how are they enforced?
    options:
      - id: a
        text: Entrypoints call bbb_require_match with the contract pattern; a bad value stops the container naming the variable.
      - id: b
        text: Only setup and preflight check the patterns; entrypoints check presence only.
      - id: c
        text: Warn only.
    recommendation: >-
      a. Values are substituted verbatim into config files; the pattern is the injection guard,
      and setup/preflight reuse the same patterns.
    affects: [BBB_DOMAIN, BBB_PUBLIC_IPV4, BBB_SHARED_SECRET, TURN_SECRET, ACME_EMAIL, BBB_FEATURES]
    related: [OQ-23, G3]

  - id: env-vs-override-precedence
    question: >-
      For node-config services (bbb-webhooks, bbb-webrtc-sfu) env variables beat Tier 3 files,
      the reverse of "override files win" elsewhere. Accept and document, or make entrypoints
      skip env for keys present in the Tier 3 file?
