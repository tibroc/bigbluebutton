      - build/packages-template/bbb-livekit/livekit.yaml:3-13 @ 35cad46a9f — packaged port range

  - name: LIVEKIT_RTC_TCP_PORT
    tier: 2
    required: false
    secret: false
    default: '7881'
    pattern: '[1-9][0-9]{0,4}'
    setup: null
    description: LiveKit ICE-TCP port, published 1:1. Upstream disables ICE-TCP (tcp_port 0).
    consumers: [livekit, compose]
    example: '7881'
    status: pending-g2
    sources:
      - pkg/config/config.go:529-538 @ 8d11efdfcd — tcp_port default 7881
      - build/packages-template/bbb-livekit/livekit.yaml:3-13 @ 35cad46a9f — packaged tcp_port 0

  - name: TURN_RELAY_PORT_MIN
    tier: 2
    required: false
    secret: false
    default: '32769'
    pattern: '[1-9][0-9]{0,4}'
    setup: null
    description: First port of the coturn relay range (min-port).
    consumers: [coturn, compose]
    example: '32769'
    status: pending-g2
    notes: Range and networking (host network vs bridge) follow RB-02 (OQ-14).
    sources:
      - bbb-install.sh:1916-1917 @ 2547823185 — min-port/max-port 32769-65535

  - name: TURN_RELAY_PORT_MAX
    tier: 2
    required: false
    secret: false
    default: '65535'
    pattern: '[1-9][0-9]{0,4}'
    setup: null
    description: Last port of the coturn relay range (max-port).
    consumers: [coturn, compose]
    example: '65535'
    status: pending-g2
    sources:
      - bbb-install.sh:1916-1917 @ 2547823185 — min-port/max-port 32769-65535

  - name: POSTGRES_BBB_CORE_PASSWORD
    tier: 2
    required: false
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
