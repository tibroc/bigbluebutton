      - build/packages-template/bbb-graphql-server/hasura-config.env:1 @ 35cad46a9f — HASURA_GRAPHQL_DATABASE_URL
      - build/packages-template/bbb-graphql-server/after-install.sh:16-22 @ 35cad46a9f — role created with a fixed value

  - name: POSTGRES_BBB_HASURA_PASSWORD
    tier: 2
    required: false
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: Password of the PostgreSQL role bbb_hasura (BBB data source of Hasura).
