# BigBlueButton 4.0 container stack (walking skeleton). The only production compose file: it is
# committed, never generated. Configuration logic lives in the images (their entrypoints); this
# file only wires them together. Variables: docker/config-contract.yaml (.env.sample is
# generated from it). Each service gets only the contract variables it reads.
#
#   docker compose up -d
#
# Not in the skeleton yet: recording, learning dashboard data, office conversion, webhooks,
# greenlight, monitoring, setup and preflight. See docker/README.md.

name: bigbluebutton

services:
  # TLS edge on 443 (ADR-07): terminates TLS and routes by ALPN / first byte to nginx (PROXY
  # protocol) or coturn. Resolves its backends at run time, so it needs no start order.
  # Inside the stack, BBB_DOMAIN resolves to haproxy (network alias), as the server's own name
  # resolves to the server on bare metal: bbb-web fetches https://BBB_DOMAIN/default.pdf at every
  # create, without depending on public DNS or on the router sending the host's traffic to its
  # own public address back in (hairpin NAT).
  haproxy:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-haproxy:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      BBB_DOMAIN: ${BBB_DOMAIN}
    ports:
      - "443:443/tcp"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp
      - /etc/haproxy
      - /run/haproxy
    volumes:
      - certs:/etc/haproxy/certs:ro
    networks:
      bbb:
        aliases:
          - ${BBB_DOMAIN}
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "echo 'show info' | socat -t 2 stdio UNIX-CONNECT:/run/haproxy/admin.sock | grep -q '^Name: HAProxy'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Obtains and renews the certificate for BBB_DOMAIN (HTTP-01 through nginx on :80) and writes
  # the haproxy bundle into `certs`; haproxy reloads it by itself.
  certbot:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-certbot:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      BBB_DOMAIN: ${BBB_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    read_only: true
    tmpfs:
      - /tmp
      - /etc/bbb-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certs:/etc/haproxy/certs
      - acme-webroot:/var/www/bigbluebutton-default/assets/.well-known/acme-challenge
    networks:
      - bbb
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grep", "-qx", "ok", "/tmp/bbb-certbot/status"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3

  # Web server: html5 client, landing page, ACME webroot, API and websocket routes. nginx
  # resolves the upstream service names once, at start: restart it after an upstream container
  # was recreated (docker/README.md).
  nginx:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-nginx:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      BBB_FEATURES: ${BBB_FEATURES-recording}
      BBB_NETWORK_SUBNET: ${BBB_NETWORK_SUBNET:-172.30.82.0/24}
    ports:
      - "80:80/tcp"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/sites-available
      - /usr/share/bigbluebutton/nginx
    volumes:
      - bbb-data:/var/bigbluebutton:ro
      - acme-webroot:/var/www/bigbluebutton-default/assets/.well-known/acme-challenge:ro
    networks:
      - bbb
      - notes
    depends_on:
      bbb-web:
        condition: service_healthy
      shared-notes:
        condition: service_healthy
      graphql-middleware:
        condition: service_healthy
      graphql-server:
        condition: service_healthy
      livekit:
        condition: service_healthy
      bbb-webrtc-sfu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--haproxy-protocol", "http://127.0.0.1:81/bigbluebutton/rtt-check"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  bbb-web:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-web:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    user: "${BBB_UID:-998}:${BBB_GID:-998}"
    environment:
      BBB_DOMAIN: ${BBB_DOMAIN}
      BBB_SHARED_SECRET: ${BBB_SHARED_SECRET}
      TURN_SECRET: ${TURN_SECRET}
      BBB_FEATURES: ${BBB_FEATURES-recording}
      BBB_WEB_CONVERSION_URL: ${BBB_WEB_CONVERSION_URL:-}
      BBB_WEB_PAGE_TOKEN_SECRET: ${BBB_WEB_PAGE_TOKEN_SECRET:-}
      BBB_WEB_MAX_HEAP_SIZE: ${BBB_WEB_MAX_HEAP_SIZE:-384m}
    read_only: true
    tmpfs:
      - /tmp
      - /run/bbb-web
    volumes:
      - bbb-data:/var/bigbluebutton
    networks:
      - bbb
      - notes
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/bigbluebutton/api"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3

  akka-apps:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-apps-akka:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      BBB_DOMAIN: ${BBB_DOMAIN}
      BBB_SHARED_SECRET: ${BBB_SHARED_SECRET}
      POSTGRES_BBB_CORE_PASSWORD: ${POSTGRES_BBB_CORE_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
    # The html5 client settings override (Tier 3) ships empty in the image; mount your file over
    # it in a compose override (docker/README.md, "Override files").
    networks:
      - bbb
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8901 && printf 'GET /healthz HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -qE '^HTTP/1\\.[01] (200|503) '"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Hasura. start_period covers the entrypoint's metadata apply, which waits up to 180 s for
  # the database (the image's 120 s are shorter).
  graphql-server:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-graphql-server:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      POSTGRES_HASURA_APP_PASSWORD: ${POSTGRES_HASURA_APP_PASSWORD:-}
      POSTGRES_BBB_HASURA_PASSWORD: ${POSTGRES_BBB_HASURA_PASSWORD:-}
    read_only: true
    tmpfs:
      # exec: the hasura CLI (HOME=/tmp) unpacks its cli-ext helper below /tmp/.hasura and runs it
      # during `metadata apply`; Docker mounts tmpfs noexec by default (RB-04, 2026-10-18).
      - /tmp:exec
      - /run/bbb-graphql-server
    networks:
      - bbb
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8085/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 200s
      retries: 3

  graphql-middleware:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-graphql-middleware:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - bbb
    depends_on:
      redis:
        condition: service_healthy
      graphql-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8378/metrics"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  graphql-actions:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-graphql-actions:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - bbb
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.SERVER_PORT || 8093) + '/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  # BlockNote backend. Attached to the internal `notes` network only (compose.md, OQ-21).
  shared-notes:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-shared-notes:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      POSTGRES_BLOCKNOTE_PASSWORD: ${POSTGRES_BLOCKNOTE_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
      - /usr/share/bbb-shared-notes-server/config
    networks:
      - notes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8787, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  # Whiteboard annotation export to PDF: pops jobs that akka-apps queues in redis, reads the
  # presentation from bbb-data, writes the PDF there and uploads it to bbb-web. A writer of
  # bbb-data, so it runs as BBB_UID/BBB_GID like bbb-web. It exits when redis goes away (as on
  # bare metal, where systemd restarts it); the restart policy brings it back.
  export-annotations:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-export-annotations:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    user: "${BBB_UID:-998}:${BBB_GID:-998}"
    read_only: true
    tmpfs:
      - /tmp
      - /usr/local/bigbluebutton/bbb-export-annotations/config
    volumes:
      - bbb-data:/var/bigbluebutton
    networks:
      - bbb
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/lib/bbb/export-annotations-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Ubuntu 24.04's version (redis-server 7.0.15), as on bare metal. A fixed address, as bare
  # metal's 127.0.0.1: akka-apps and bbb-web (lettuce) keep the address they resolved for redis
  # for the TTL of Docker's DNS answers (600 s) and reconnect to it, while Docker gives a
  # restarted or recreated container a new address unless it is fixed.
  redis:
    image: docker.io/library/redis:7.0.15-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      bbb:
        ipv4_address: ${BBB_REDIS_IP:-172.30.82.21}
      notes: {}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  postgres:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-postgres:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bbb
      - notes
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Run-only job (ADR-14): (re)creates the BBB databases and roles when the image version
  # changes, then exits. `docker compose up` runs it before its dependents.
  db-init:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-db-init:${BBB_IMAGE_TAG:-4.0.1}
    restart: "no"
    labels:
      org.bigbluebutton.run-only: "true"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_BBB_CORE_PASSWORD: ${POSTGRES_BBB_CORE_PASSWORD:-}
      POSTGRES_HASURA_APP_PASSWORD: ${POSTGRES_HASURA_APP_PASSWORD:-}
      POSTGRES_BBB_HASURA_PASSWORD: ${POSTGRES_BBB_HASURA_PASSWORD:-}
      POSTGRES_BLOCKNOTE_PASSWORD: ${POSTGRES_BLOCKNOTE_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - bbb
    depends_on:
      postgres:
        condition: service_healthy

  # Media server (ADR-06): one UDP port for all WebRTC media, published 1:1; signaling through
  # nginx (/livekit/). Fixed address on `bbb`: coturn relays only to it.
  livekit:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-livekit:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      BBB_PUBLIC_IPV4: ${BBB_PUBLIC_IPV4}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_RTC_UDP_PORT: ${LIVEKIT_RTC_UDP_PORT:-7882}
    ports:
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"
    read_only: true
    tmpfs:
      - /tmp
      - /run/livekit-server
    networks:
      bbb:
        ipv4_address: ${BBB_LIVEKIT_IP:-172.30.82.20}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  # LiveKit controller (ADR-15), FreeSWITCH adapter removed.
  bbb-webrtc-sfu:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-webrtc-sfu:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    user: "${BBB_UID:-998}:${BBB_GID:-998}"
    environment:
      BBB_DOMAIN: ${BBB_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BBB_FEATURES: ${BBB_FEATURES-recording}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - bbb
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/bbb/bbb-webrtc-sfu-healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # TURN (ADR-07): 3478/udp+tcp published, TURN over TLS arrives through haproxy on 443. The
  # relay range stays internal. The base image also exposes 5349, which is not published.
  coturn:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-coturn:${BBB_IMAGE_TAG:-4.0.1}
    restart: unless-stopped
    environment:
      BBB_DOMAIN: ${BBB_DOMAIN}
      TURN_SECRET: ${TURN_SECRET}
      TURN_RELAY_PORT_MIN: ${TURN_RELAY_PORT_MIN:-49160}
      TURN_RELAY_PORT_MAX: ${TURN_RELAY_PORT_MAX:-49199}
      BBB_LIVEKIT_IP: ${BBB_LIVEKIT_IP:-172.30.82.20}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    read_only: true
    tmpfs:
      - /tmp
      - /run/turnserver
    networks:
      - bbb
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-t", "2000", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional, as on bare metal (BBB_FEATURES=webhooks). nginx proxies /bigbluebutton/api/hooks
  # to it; it reads the meeting events from redis.
  webhooks:
    image: ${BBB_IMAGE_REGISTRY:-ghcr.io/bigbluebutton}/bbb-webhooks:${BBB_IMAGE_TAG:-4.0.1}
    profiles: [webhooks]
    restart: unless-stopped
    environment:
      BBB_DOMAIN: ${BBB_DOMAIN}
      BBB_SHARED_SECRET: ${BBB_SHARED_SECRET}
      WEBHOOKS_BEARER_AUTH: ${WEBHOOKS_BEARER_AUTH:-true}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - bbb
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/bbb/bbb-webhooks-healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  bbb:
    ipam:
      config:
        - subnet: ${BBB_NETWORK_SUBNET:-172.30.82.0/24}
          # Dynamic addresses only from here; the fixed ones (livekit, redis) lie outside it.
          ip_range: ${BBB_NETWORK_IP_RANGE:-172.30.82.128/25}
  # shared-notes and the services it talks to (compose.md "Networks", OQ-21).
  notes:
    internal: true

volumes:
  bbb-data:
  postgres-data:
  certs:
  acme-webroot:
  letsencrypt:
